<svg fill="none" viewBox="0 0 1200 420" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          position: relative;
          width: 100%;
          height: 420px;
          background: linear-gradient(135deg, #090d16 0%, #0f172a 45%, #1e1035 100%);
          border-radius: 16px;
          overflow: hidden;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          box-sizing: border-box;
          border: 1px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        /* Dynamic background grid */
        .grid {
          position: absolute;
          inset: 0;
          background-image: 
            linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
          background-size: 40px 40px;
          mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
        }

        /* Animated glowing orbs */
        .orb {
          position: absolute;
          border-radius: 50%;
          filter: blur(80px);
          opacity: 0.45;
          animation: float 12s ease-in-out infinite alternate;
        }
        .orb-1 {
          width: 380px;
          height: 380px;
          background: #6366f1;
          top: -80px;
          left: -60px;
        }
        .orb-2 {
          width: 320px;
          height: 320px;
          background: #ec4899;
          bottom: -60px;
          right: 5%;
          animation-duration: 9s;
          animation-direction: alternate-reverse;
        }
        .orb-3 {
          width: 260px;
          height: 260px;
          background: #06b6d4;
          top: 30%;
          right: 35%;
          animation-duration: 15s;
        }

        @keyframes float {
          0% { transform: translate(0, 0) scale(1); }
          50% { transform: translate(30px, 20px) scale(1.08); }
          100% { transform: translate(-20px, 35px) scale(0.95); }
        }

        /* Floating environment flow nodes in background */
        .flow-layer {
          position: absolute;
          inset: 0;
          pointer-events: none;
          z-index: 1;
        }
        .node-box {
          position: absolute;
          padding: 8px 16px;
          background: rgba(30, 41, 59, 0.65);
          backdrop-filter: blur(10px);
          border: 1px solid rgba(255, 255, 255, 0.12);
          border-radius: 20px;
          color: #94a3b8;
          font-size: 13px;
          font-weight: 500;
          display: flex;
          align-items: center;
          gap: 8px;
          box-shadow: 0 8px 24px rgba(0,0,0,0.3);
          animation: pulseNode 6s ease-in-out infinite alternate;
        }
        .node-1 { top: 38px; right: 80px; animation-delay: 0s; }
        .node-2 { bottom: 42px; left: 80px; animation-delay: 2s; }
        .node-3 { bottom: 42px; right: 120px; animation-delay: 4s; }

        .dot-live {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #10b981;
          box-shadow: 0 0 10px #10b981;
        }
        .dot-clone {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #38bdf8;
          box-shadow: 0 0 10px #38bdf8;
        }
        .dot-pr {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #a855f7;
          box-shadow: 0 0 10px #a855f7;
        }

        @keyframes pulseNode {
          0% { transform: translateY(0); opacity: 0.7; }
          100% { transform: translateY(-8px); opacity: 0.95; }
        }

        /* Foreground Content */
        .content {
          position: relative;
          z-index: 10;
          height: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 0 30px;
        }

        .badge-pill {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          background: rgba(99, 102, 241, 0.15);
          border: 1px solid rgba(129, 140, 248, 0.35);
          color: #c7d2fe;
          padding: 6px 16px;
          border-radius: 9999px;
          font-size: 13px;
          font-weight: 600;
          letter-spacing: 0.5px;
          margin-bottom: 20px;
          text-transform: uppercase;
        }

        .title {
          font-size: 46px;
          font-weight: 800;
          letter-spacing: -1.2px;
          line-height: 1.15;
          margin: 0 0 14px 0;
          background: linear-gradient(135deg, #ffffff 30%, #e2e8f0 60%, #93c5fd 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
        }

        .subtitle {
          font-size: 18px;
          font-weight: 400;
          color: #94a3b8;
          max-width: 820px;
          line-height: 1.5;
          margin: 0 0 24px 0;
        }

        .feature-tags {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 10px;
        }

        .tag {
          background: rgba(255, 255, 255, 0.06);
          border: 1px solid rgba(255, 255, 255, 0.12);
          color: #e2e8f0;
          padding: 6px 14px;
          border-radius: 8px;
          font-size: 13px;
          font-weight: 500;
        }
      </style>

      <div class="container">
        <div class="grid"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>

        <div class="flow-layer">
          <div class="node-box node-1">
            <span class="dot-live"></span>
            <span>PR #142 Preview • Online</span>
          </div>
          <div class="node-box node-2">
            <span class="dot-clone"></span>
            <span>vCluster Namespace • Isolated</span>
          </div>
          <div class="node-box node-3">
            <span class="dot-pr"></span>
            <span>Zero Staging Queue • Fork-on-Demand</span>
          </div>
        </div>

        <div class="content">
          <div class="badge-pill">
            <span>⚡ Curated DevOps &amp; Cloud Platform Ecosystem</span>
          </div>
          <h1 class="title">Awesome Ephemeral On-Demand Test Environments</h1>
          <p class="subtitle">
            Curated list of SaaS platforms, Kubernetes virtualization sandboxes, per-PR preview orchestrators, and open-source tooling for automated developer test environments.
          </p>
          <div class="feature-tags">
            <span class="tag">🚀 Per-PR Preview Environments</span>
            <span class="tag">☸️ Kubernetes Namespaces &amp; vClusters</span>
            <span class="tag">📦 Docker Compose Deployers</span>
            <span class="tag">🔄 Ephemeral Sandbox Orchestration</span>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>